<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CampusHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
    <div class="logo">🏫 CampusHub</div>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="issues.html">Issues</a>
        <a href="report.html">Report</a>
        <a href="about.html">About</a>
     <a href="login.html" class="login-button active">Login</a>
        <a href="register.html" class="register-link active">Register</a>
       
    </nav>
</header>

<main class="auth-page">
<section class="auth-card">
    <p class="section-label">CAMPUSHUB ACCESS</p>
    <h1>Student Login</h1>
    <p class="auth-subtitle">Sign in to continue to CampusHub.</p>

    <form id="studentLoginForm">
        <div class="auth-field">
            <label for="studentUsername">Username</label>
            <input id="studentUsername" type="text" placeholder="Enter your username" required>
        </div>
        <div class="auth-field">
            <label for="studentPassword">Password</label>
            <input id="studentPassword" type="password" placeholder="Enter your password" required>
        </div>
        <p id="studentError" class="auth-error"></p>
        <button type="submit" class="primary-btn auth-submit">Login</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <a href="admin-login.html" class="admin-login-link">
        <span>Admin Login</span><span>→</span>
    </a>

</section>
</main>

<footer><p>© 2026 CampusHub. Built for a better campus.</p></footer>

<script>

document.getElementById("studentLoginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("studentUsername").value.trim();
    const password = document.getElementById("studentPassword").value;
    const error = document.getElementById("studentError");

    error.textContent = "";

    if (!username || !password) {
        error.textContent = "Please enter both your username and password.";
        return;
    }

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
            error.textContent = data.error || "Login failed.";
            return;
        }

        if (data.user.role !== "student") {
            await fetch("/api/auth/logout", { method: "POST" });
            error.textContent = "This is not a student account.";
            return;
        }

        window.location.href = "issues.html";
    } catch (err) {
        error.textContent = "Cannot connect to the CampusHub server.";
    }
});

</script>
</body>
</html>
