<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h1>🏫 CampusHub</h1>
        <div>
            <a href="index.html">Home</a>
            <a href="issues.html">Issues</a>
            <a href="report.html">Report</a>
            <a href="about.html">About</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>
</header>

<main class="admin-page">
    <section class="issues-hero">
        <div class="issues-hero-content">
            <p class="section-label">ADMINISTRATION</p>
            <h2>Issue Management</h2>
            <p>Review reports and update their status, schedule, and expected repair time.</p>
        </div>
    </section>

    <section class="admin-section">
        <div class="section-heading">
            <p class="section-label">DATABASE</p>
            <h2>All reported issues</h2>
        </div>
        <div id="adminMessage" class="admin-message"></div>
        <div id="adminIssues" class="admin-issues"></div>
    </section>
</main>

<footer>
    <p>© 2026 CampusHub. Built for a better campus.</p>
</footer>

<script>
let issues = [];

function escapeHTML(text) {
    return String(text ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderIssues() {
    const container = document.getElementById("adminIssues");

    if (!issues.length) {
        container.innerHTML = "<div class='no-results'><h3>No issues yet</h3><p>Student reports will appear here.</p></div>";
        return;
    }

    container.innerHTML = issues.map(issue => `
        <article class="admin-card">
            <div class="admin-card-header">
                <div>
                    <span class="issue-number">#${String(issue.id).padStart(3, "0")}</span>
                    <h3>${escapeHTML(issue.title)}</h3>
                    <p>📍 ${escapeHTML(issue.location)} · ${escapeHTML(issue.category)}</p>
                </div>
                <span class="status ${escapeHTML(issue.status)}">${escapeHTML(issue.status)}</span>
            </div>

            <p class="issue-description">${escapeHTML(issue.description)}</p>

            <div class="admin-form-grid">
                <label>
                    Status
                    <select data-field="status" data-id="${issue.id}">
                        ${["pending","review","scheduled","progress","resolved"].map(status =>
                            `<option value="${status}" ${issue.status === status ? "selected" : ""}>${status}</option>`
                        ).join("")}
                    </select>
                </label>

                <label>
                    Scheduled date
                    <input type="date" data-field="scheduledDate" data-id="${issue.id}" value="${escapeHTML(issue.scheduledDate || "")}">
                </label>

                <label>
                    Scheduled time
                    <input type="time" data-field="scheduledTime" data-id="${issue.id}" value="${escapeHTML(issue.scheduledTime || "")}">
                </label>

                <label>
                    Expected duration
                    <input type="text" data-field="expectedDuration" data-id="${issue.id}" placeholder="e.g. 2 hours" value="${escapeHTML(issue.expectedDuration || "")}">
                </label>
            </div>

            <button class="primary-btn save-issue" data-id="${issue.id}">Save Update</button>
        </article>
    `).join("");

    document.querySelectorAll(".save-issue").forEach(button => {
        button.addEventListener("click", () => saveIssue(Number(button.dataset.id)));
    });
}

function valueFor(id, field) {
    return document.querySelector(`[data-field="${field}"][data-id="${id}"]`).value;
}

async function saveIssue(id) {
    const payload = {
        status: valueFor(id, "status"),
        scheduledDate: valueFor(id, "scheduledDate"),
        scheduledTime: valueFor(id, "scheduledTime"),
        expectedDuration: valueFor(id, "expectedDuration")
    };

    const response = await fetch(`/api/issues/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await response.json();
    const message = document.getElementById("adminMessage");

    if (!response.ok) {
        message.textContent = data.error || "Update failed.";
        return;
    }

    message.textContent = "Issue updated successfully.";
    await loadIssues();
}

async function loadIssues() {
    const response = await fetch("/api/issues");
    if (!response.ok) throw new Error("Could not load issues.");
    issues = await response.json();
    renderIssues();
}

document.addEventListener("DOMContentLoaded", async () => {
    const me = await fetch("/api/auth/me").then(r => r.json());

    if (!me.user || me.user.role !== "admin") {
        window.location.href = "admin-login.html";
        return;
    }

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/api/auth/logout", { method: "POST" });
        window.location.href = "admin-login.html";
    });

    await loadIssues();
});
</script>
</body>
</html>
